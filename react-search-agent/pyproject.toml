[project]
name = "react-search-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KVVinitha98", email = "48166344+KVVinitha98@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
]

[project.scripts]
react-search-agent = "react_search_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
]
